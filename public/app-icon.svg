<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF758C" />
      <stop offset="100%" stop-color="#FF7EB3" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#b83b5e" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background with smooth iOS squircle look -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner card glow -->
  <circle cx="256" cy="240" r="170" fill="#ffffff" fill-opacity="0.2" filter="url(#shadow)"/>
  
  <!-- Main Sakura Emoji / Icon -->
  <text x="256" y="270" font-size="200" text-anchor="middle" dominant-baseline="central">🌸</text>
  
  <!-- Bottom Text Label -->
  <text x="256" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Prompt', sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">KANSAI TRIP</text>
</svg>

